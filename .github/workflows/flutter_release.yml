name: Flutter Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm dpkg fakeroot binutils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (hanya ARM architectures)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform=android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/anidong-armeabi-v7a-release.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   build/app/outputs/flutter-apk/anidong-arm64-v8a-release.apk

      - name: Build Linux app
        run: |
          flutter build linux --release

      - name: Package Linux DEB
        run: |
          VERSION="1.0.1"
          BUILD_DIR="build/linux/x64/release/bundle"
          DEB_DIR="dist/anidong_${VERSION}_amd64"
          mkdir -p dist
          mkdir -p ${DEB_DIR}/opt/anidong
          mkdir -p ${DEB_DIR}/usr/share/applications
          mkdir -p ${DEB_DIR}/usr/share/icons/hicolor/512x512/apps

          cp -r ${BUILD_DIR}/* ${DEB_DIR}/opt/anidong/
          if [ -f "assets/images/icon.png" ]; then
            cp assets/images/icon.png ${DEB_DIR}/usr/share/icons/hicolor/512x512/apps/anidong.png
          fi

          cat << DESKTOP > ${DEB_DIR}/usr/share/applications/anidong.desktop
          [Desktop Entry]
          Name=Anidong
          Exec=/opt/anidong/anidong
          Icon=anidong
          Type=Application
          Categories=Utility;
          Terminal=false
          DESKTOP

          mkdir -p ${DEB_DIR}/DEBIAN
          cat << CONTROL > ${DEB_DIR}/DEBIAN/control
          Package: anidong
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: example@example.com
          Description: aplikasi pendamping pecinta anime dan donghua!
          CONTROL

          dpkg-deb --build ${DEB_DIR}

      - name: Package Linux RPM
        run: |
          VERSION="1.0.1"
          BUILD_DIR="build/linux/x64/release/bundle"
          RPM_ROOT="${HOME}/rpmbuild"

          rm -rf ${RPM_ROOT}/BUILDROOT/*

          cat << SPEC > ${RPM_ROOT}/SPECS/anidong.spec
          Name:           anidong
          Version:        ${VERSION}
          Release:        1
          Summary:        aplikasi pendamping pecinta anime dan donghua!
          License:        MIT
          URL:            https://example.com
          BuildArch:      x86_64

          %description
          aplikasi pendamping pecinta anime dan donghua!

          %install
          mkdir -p %{buildroot}/opt/anidong
          mkdir -p %{buildroot}/usr/share/applications

          cp -r ${PWD}/${BUILD_DIR}/* %{buildroot}/opt/anidong/

          cat << DESKTOP > %{buildroot}/usr/share/applications/anidong.desktop
          [Desktop Entry]
          Name=Anidong
          Exec=/opt/anidong/anidong
          Icon=anidong
          Type=Application
          Categories=Utility;
          Terminal=false
          DESKTOP

          %files
          /opt/anidong/
          /usr/share/applications/anidong.desktop
          SPEC

          rpmbuild -bb ${RPM_ROOT}/SPECS/anidong.spec
          cp ${RPM_ROOT}/RPMS/x86_64/anidong-${VERSION}-1.x86_64.rpm dist/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/anidong-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/anidong-arm64-v8a-release.apk
            dist/anidong_1.0.1_amd64.deb
            dist/anidong-1.0.1-1.x86_64.rpm
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
