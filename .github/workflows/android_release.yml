name: Android Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_android:
    name: Build Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APKs
        run: cd android && ./gradlew assembleRelease

      - name: Organize APK Artifacts
        run: |
          cd android/app/build/outputs/apk/release
          cp app-arm64-v8a-release.apk anidong-arm64-v8a.apk 2>/dev/null || cp app-arm64-v8a-release-unsigned.apk anidong-arm64-v8a.apk 2>/dev/null || true
          cp app-armeabi-v7a-release.apk anidong-armeabi-v7a.apk 2>/dev/null || cp app-armeabi-v7a-release-unsigned.apk anidong-armeabi-v7a.apk 2>/dev/null || true
          cp app-universal-release.apk anidong-universal.apk 2>/dev/null || cp app-universal-release-unsigned.apk anidong-universal.apk 2>/dev/null || cp app-release.apk anidong-universal.apk 2>/dev/null || cp app-release-unsigned.apk anidong-universal.apk 2>/dev/null || true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/anidong-arm64-v8a.apk
            android/app/build/outputs/apk/release/anidong-armeabi-v7a.apk
            android/app/build/outputs/apk/release/anidong-universal.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
