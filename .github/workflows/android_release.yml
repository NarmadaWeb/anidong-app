name: Android Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/anidong-release.apk || cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/anidong-release.apk

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/anidong-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
